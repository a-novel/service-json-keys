# Podman drops a Dockerfile's HEALTHCHECK from OCI images, the format it builds by default and the
# one images are published in: a service the others wait for declares its check here.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready"]
  interval: 1s
  timeout: 5s
  retries: 10

# The targets leave POSTGRES_PORT unset and reach the database on its default port, 5432. The
# a-novel daemon owns that name for the host port it publishes the database on.
services:
  # ====================================================================================================================
  # DATABASE
  # ====================================================================================================================

  postgres-json-keys:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - api
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - json-keys-postgres-data:/var/lib/postgresql/
    healthcheck: *postgres-healthcheck

  # ====================================================================================================================
  # ONE-SHOT TARGETS
  # ====================================================================================================================

  service-json-keys-migrations:
    # Also under the profiles of the targets waiting for it, so `--profile <target>` runs it first.
    profiles: ["migrations", "rotate-keys"]
    build:
      context: ..
      dockerfile: ./builds/migrations.Dockerfile
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
    networks:
      - api

  service-json-keys-rotate-keys:
    profiles: ["rotate-keys"]
    build:
      context: ..
      dockerfile: ./builds/rotate-keys.Dockerfile
    depends_on:
      postgres-json-keys:
        condition: service_healthy
      service-json-keys-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
      # Local-dev test key — never used in production.
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca
    networks:
      - api

  # ====================================================================================================================
  # LONG-RUNNER TARGETS
  # ====================================================================================================================

  service-json-keys-grpc:
    profiles: ["grpc"]
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca
    networks:
      - api

  service-json-keys-rest:
    profiles: ["rest"]
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: false
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca
    networks:
      - api

networks:
  api:

volumes:
  json-keys-postgres-data:
