# Podman drops a Dockerfile's HEALTHCHECK from OCI images, the format it builds by default and the
# one images are published in: a service the others wait for declares its check here.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready"]
  interval: 1s
  timeout: 5s
  retries: 10

services:
  postgres-json-keys:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - json-keys-integration-grpc-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    healthcheck: *postgres-healthcheck

  service-json-keys:
    build:
      context: ..
      dockerfile: ./builds/standalone.grpc.Dockerfile
    ports:
      - "${GRPC_PORT}:8080"
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DATABASE: "${POSTGRES_DB}"
      POSTGRES_TLS_ENABLED: false
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
    networks:
      - json-keys-integration-grpc-test

networks:
  json-keys-integration-grpc-test:
