# Default JWK configuration for all registered key usages. The gRPC server, the
# rotate-keys job and the Go client embed it.
# Each top-level key is a usage name. Its value configures the signing algorithm,
# the key lifetime and the JWT claims of every token signed under that usage.

# Short-lived access tokens issued by the authentication service.
auth:
  alg: Ed25519
  key:
    ttl: 168h # 7 days — how long a key version stays active before expiring
    rotation: 24h # a new key is generated every 24h; older keys remain active until their TTL
    cache: 30m # how long public keys are cached locally before re-fetching
    staleIfError: 24h # cached keys stay in use this long past the cache while re-fetching fails
    staleWhileRevalidate: 30m # cached keys keep serving this long past the cache while one fetch refreshes them
  token:
    ttl: 1h # recipients verify tokens offline, so a token stays valid up to this long after sign-out
    issuer: "anovel-authentication"
    audience: "anovel-client"
    subject: "user-access"
    leeway: 5m # clock-skew tolerance when validating token expiry

# Long-lived refresh tokens used to obtain new access tokens without re-authentication.
auth-refresh:
  alg: Ed25519
  key:
    ttl: 720h # 30 days
    rotation: 168h # 7 days
    cache: 30m
    staleIfError: 24h
    staleWhileRevalidate: 30m
  token:
    ttl: 168h # 7 days
    issuer: "anovel-authentication"
    audience: "anovel-client"
    subject: "user-refresh"
    leeway: 5m
